<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <title>forumz</title> 
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #FFF7E2;       
      --card-default: #FFF4B7;   
      --card-checked: #FFDBE8;   
      --accent-border: #FFA2C3;  
      --btn-color: #FF8FB7;      
      --btn-hover: #FF70A2;
      --clear-btn: #BCE7FF;
      --clear-hover: #96D7FF;
      --input-bg: #D1FFFA;       
      --input-focus: #A8FFF1;    
      --text-color: #4A4A4A;
    }

    body {
      /* APPLIED THE CUTE FONT HERE */
      font-family: "Fredoka", system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container, .image-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(255, 143, 183, 0.15);
      border: 3px solid var(--card-default);
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }

    .image-container {
      display: none;
    }

    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-top: 15px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 25px;
      color: var(--text-color);
      text-shadow: 1px 1px 0px #FFF;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label.field-label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #5A5A5A;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid transparent;
      border-radius: 12px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 0.95rem;
      background-color: var(--input-bg);
      color: var(--text-color);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent-border);
      background-color: var(--input-focus);
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(168, 255, 241, 0.4);
    }

    .inline-options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 6px 4px;
    }

    .inline-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      background-color: #F9F9F9;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #EAEAEA;
      transition: all 0.2s ease;
    }

    .inline-options label:hover {
      background-color: var(--card-checked);
      border-color: var(--accent-border);
    }

    .inline-options input[type="radio"],
    .inline-options input[type="checkbox"] {
      accent-color: var(--btn-color);
      transform: scale(1.1);
    }

    .button-cluster {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button[type="submit"], button[type="reset"], .back-btn {
      border: none;
      padding: 14px 20px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    button[type="submit"] {
      background-color: var(--btn-color);
      color: white;
      flex: 2;
    }

    button[type="submit"]:hover {
      background-color: var(--btn-hover);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 15px rgba(255, 112, 162, 0.4);
    }

    button[type="reset"] {
      background-color: var(--clear-btn);
      color: #3B5866;
      flex: 1;
    }

    button[type="reset"]:hover {
      background-color: var(--clear-hover);
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 15px rgba(150, 215, 255, 0.4);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    .back-btn {
      background-color: #8c8c8c;
      color: white;
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head> 
<body>

  <div class="container" id="formView">
    <h1>Register</h1> 

    <form id="registrationForm">
      <div class="input-group">
        <label class="field-label" for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your tag..." required>
      </div>

      <div class="input-group">
        <label class="field-label" for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your comms email..." required>
      </div>

      <div class="input-group">
        <label class="field-label" for="grade">Grade Level:</label>
        <select id="grade" name="grade" required>
          <option value="" disabled selected>Select your role...</option>
          <option value="7">cook (¬_¬) </option>
          <option value="8">dishes (..◜ᴗ◝..)</option>
          <option value="9">ingredients ₍^. .^₎Ⳋ </option>
          <option value="10">plating (˶°ㅁ°) !! </option>
        </select>
      </div>

      <div class="input-group">
        <label class="field-label">Gender:</label>
        <div class="inline-options">
          <label><input type="radio" name="gender" value="male" required> Male ദ്ദി(ᵔᗜᵔ) </label>
          <label><input type="radio" name="gender" value="female"> Female (っ'ヮ'c) </label>
        </div>
      </div>

      <div class="input-group">
        <label class="field-label">What do you expect,,,</label>
        <div class="inline-options">
          <label><input type="checkbox" name="interests" value="web-design"> BORING( ;´ - `;) </label>
          <label><input type="checkbox" name="interests" value="programming"> FUN („• ֊ •„) </label>
          <label><input type="checkbox" name="interests" value="robotics"> ADVENTOROUS _(´ཀ`」 ∠) _</label>
        </div>
      </div>

      <div class="input-group">
        <label class="field-label" for="message">Message:</label>
        <textarea id="message" name="message" rows="3" placeholder="Leave a note..." required></textarea>
      </div>

      <div class="input-group">
        <label class="field-label" for="password">Password:</label>
        <input type="password" id="password" name="password" value="roblox">
      </div>

      <div class="button-cluster">
        <button type="reset">Clear</button>
        <button type="submit">SEND NOW!!!!!!!!</button>
      </div>
    </form>
  </div>

  <div class="image-container" id="imageView">
    <h1>▀▄▀▄▀▄▀▄▀▄▀▄</h1>
    <img src="https://i.pinimg.com/1200x/f8/e1/03/f8e103da2c63a335db8c829914896c6a.jpg" alt="Your Uploaded JPG View">
    <button class="back-btn" onclick="returnToForm()">Return to Select</button>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('formView').style.display = 'none';
      document.getElementById('imageView').style.display = 'block';
    });

    function returnToForm() {
      document.getElementById('imageView').style.display = 'none';
      document.getElementById('formView').style.display = 'block';
    }
  </script>

</body> 
</html>
